<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>p238 예제 코드</title>
	<style>
		#container{
			width:650px;
			margin:0 auto;
			padding:5px;
		}
		
		
		table, td{
			border:1px solid #cdcdcd;
			border-collapse: collapse;
		}
		
		img{
			display:block;
			border:1px solid #cdcdcd;
		}
		
		#div{
			color: #ffffff;
			background:#000000;
			padding: 5px;
		}
		
		h2{
			color:#ff0000;
		}
		
		h2, p{
			text-align:center;
		}
		
		p{
			font-weight:bold;
		}
		
		#span1{
			color:#0000ff;
		}
		
		#span2{
			color:#0000ff;
			font-weight:bold;
		}
		
		#span3{
			font-size:small;
		}
	</style>
</head>
<body>
	<div id="container">
		<table>
			<tr>
				<td><img src="images/top.jpg" alt="apple.jpg"></td>
			</tr>
			<tr>
				<td><div id="div">확인하세요</div></td>
			</tr>
			<tr>
				<td>
					<h2>주문 및 배송</h2>
					<p><span id="span1">오후 2시 이전</span> 주문건은 당일 발송합니다.<br> 2시 이후 주문건은 다음날 배송합니다.(주말 제외)</p>
				</td>
			</tr>
			<tr>
				<td>
					<h2>교환 및 환불</h2>
					<p>불만족시<span id="span2">100%</span> 환불해 드립니다.<br> 고객센터로 전화주세요.</p>
				</td>
			</tr>
			<tr>
				<td>
					<h2>고객센터</h2>
					<p>0000-0000<br><span id="span3">상담시간: 오전 9시 ~ 오후 6시(토/일, 공휴일 휴무)</span></p>
				</td>
			</tr>
		</table>
	</div>
</body>
</html>
