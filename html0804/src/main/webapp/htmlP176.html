<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>상품 소개 페이지</title>
	<style>
		* {
			margin: 10px auto;
		}		
		h1:hover {
			padding: 10px;
			width: 500px;
			background-color: rgb(0,0,0);
			color: white;
			text-align: center;
		}
		ul {
			background-color: green;
		}
		ul li{
			display: inline;
			background-color: red;
		}
		img {
			width: 100px;
		}
		#nd {
			border: 1px solid red;
		}
		p { 
			font-size: 16px;
			font-style: italic;
		}
		.blue {
			color: blue;
		}
		#color {
			color: green;
		}
		.red {
			color: red;
		}
		h1, p {
			text-align: center;
		}		
	</style>
</head>
<body>
	<h1>레드향</h1>
	<p class="blue red" id="color">껍질에 붉은 빛이돌아 레드향이라 불린다.</p>
	<p id="nd" style="border: 1px solid red;">레드향은 한라봉과 귤을 교배한 것으로 .....</p>
	<p>비타민 C와 비타민 P가 풍부해 ....</p>
	<img alt="cat.jpg" src="images/cat.jpg">
	<img alt="cat.jpg">
	
	<ul>
		<li>1</li>
		<li>2</li>
	</ul>
</body>
</html>
