<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>P240 예제</title>
	<style>
		body {
			border: 1px solid #cdcdcd;
		}
		
		#container * {
			border: 1px solid #0000ff;
		}
		.accent {
			color : #ff0000;
			font-weight: bold;
		}
		
		#accent {
			display: inline;
		}
	</style>
</head>
<body>
	<div id="container">
		<h1>시간이란...</h1>
		<div>내일 죽을 것처럼<p class="accent" id="accent">오늘</p>을 살고</div>
		<p>영원히 살 것처럼<br>내일을 꿈꾸어라.</p>
	</div>
</body>
</html>
