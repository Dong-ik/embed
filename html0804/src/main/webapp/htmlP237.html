<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>P237 예제</title>
<style>
	table {
		border : 1px solid;
		border-collapse : collapse;
	}
	
	th, td {
		border : 1px solid;
		padding: 10px;
	}
	
	th {
		text-align: center;
	}
	
	td {
		text-align: right;
	}
	
	#last {
		background-color: #e5f6f6;
	}
	
	caption {
		text-align: right;
		caption-side: bottom;
	}
</style>
</head>
<body>
	<form>
		<table>
			<tr>
				<th>지수</th>
				<th>2019년</th>
				<th>2020년</th>
				<th>2021년</th>
				<th id="last">2022년</th>
			</tr>
			<tr>
				<th>가구 수</th>
				<td>20,891,348</td>
				<td>21,484,785</td>
				<td>22,022,753</td>
				<td id="last">22,383,187</td>
			</tr>
			<tr>
				<th>1인 가구 수</th>
				<td>6,147,516</td>
				<td>6,643,354</td>
				<td>7,165,788</td>
				<td id="last">7,502,350</td>
			</tr>
			<caption>출처: 통계청 100대 지표</caption>
		</table>
	</form>
</body>
</html>
