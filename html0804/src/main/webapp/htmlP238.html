<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>P238 예제</title>
	<style>
		#container {
			margin: 10px auto;
		}
		table {
			width:600px;
			border-collapse : collapse;
		}
		
		th, td {
			border : 1px solid;
			border-left : 1px dotted;
			border-right: 1px dotted;
			padding: 10px;
			text-align: center;
		}
		
		label {
			font-size: 1.5em;
			color: #ff0000;
			font-weight: 600;
		}
		
		p {
			font-size: 1.2em;
			line-height: 2em;
			font-weight: 600;
		}
	</style>
</head>
<body>
	<div id="container">
	<img src="images/top.jpg" width="600px" height="auto">
	<table> 
		<tr>
			<td style="background-color: black; text-align: left; color: white;">확인하세요</td>
		</tr>
		<tr>
			<td>
				<label>주문 및 배송</label>
				<p><font color="#0000ff">오후 2시 이전</font> 주문건은 당일 발송합니다<br>
				2시 이후 주문건은 다음날 발송합니다(주말 제외)</p>				
			</td>
		</tr>
		<tr>
			<td>
				<label>교환 및 환불</label>
				<p>불만족시 <font color="#0000ff">100% 환불</font>해 드립니다.<br>
				고객센터로 전화주세요</p>
			</td>
		</tr>
		<tr>
			<td>
				<label>고객센터</label>
				<P>0000-0000<br>
				<small style="font-size: 0.7em">상담시간 : 오전 9시 ~ 오후 6시(토/일, 공휴일 휴무)</small></p>
			</td>
		</tr>
	</table>
	</div>
</body>
</html>
