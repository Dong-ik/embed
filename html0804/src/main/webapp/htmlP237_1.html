<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>p237 예제 코드</title>
	<style>
		#container{
			width: 500px;
			margin:20px auto;
		}
	
		table, th, td {
			border:solid 1px black;
			border-collapse:collapse;
			padding:10px;
		}
		
		#pf, #hf {
			font-weight:bold;
			text-align:center;
		}
		
		table th:nth-child(5), td:nth-child(5){
			background-color:#e5f6f6;	
		}
		
		caption{
			caption-side: bottom;
			text-align:right;
		}
	</style>
</head>
<body>
	<div id="container">
		<table>
			<caption>출처: 통계청 100대 지표</caption>
			<thead>
				<tr id="title">
					<th>지수</th>
					<th>2019년</th>
					<th>2020년</th>
					<th>2021년</th>
					<th>2022년</th>
				</tr>
			</thead>
			
			<tbody>
				<tr>
					<td id="hf">가구수</td>
					<td>20,891,348</td>
					<td>21,484,785</td>
					<td>22,022,753</td>
					<td>22,383,187</td>
				</tr>
				
				<tr>
					<td id="pf">1인 가구 수</td>
					<td>6,147,516</td>
					<td>6,643,354</td>
					<td>7,165,788</td>
					<td>7,502,350</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
