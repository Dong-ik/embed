<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>P271 예제</title>
	<style>
		* {
			box-sizing: border-box;
		}
		
		#container {
			width: 700px;
			margin : 0 auto;
		}
		
		h2 {
			text-align: center;
		}
		
		nav ul {
			list-style: none;
			display: inline-block;
		}
		
		nav ul li {
			display: inline-block;
			border: 1px solid #cdcdcd;
			padding: 20px;
		}
	</style>
</head>
<body>
	<h2>목록을 사용해 가로 내비게이션 만들기</h2>
	<div id="container">
		<ul>
			<nav>
				<ul>
					<li><a href="http://www.naver.com">menu 1</a></li>
				</ul>
				<ul>
					<li>menu 2</li>
				</ul>
				<ul>
					<li>menu 3</li>
				</ul>
				<ul>
					<li>menu 4</li>
				</ul>
			</nav>
		</ul>
	</div>
</body>
</html>
