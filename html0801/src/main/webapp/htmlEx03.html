<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3번 예제</title>
<style>
		table, th, td {
			border: 5px solid #DCDCDC;
			border-collapse: collapse;
		}
</style>
</head>
<body>
	<form method="post">
		<p>회원가입</p>
		<table>
			<tr>
				<td><label for="name" id="name">이름</label></td>
				<td><input type="text" name="name"></td>
			</tr>
			<tr>
				<td><label for="userId" id="userId">아이디</label></td>
				<td><input type="text" name="userId"></td>
			</tr>
			<tr>
				<td><label for="password" id="password">비밀번호</label></td>
				<td><input type="password" name="password"></td>
			</tr>
			<tr>
				<td><label for="passwordRe" id="passwordRe">비밀번호 확인</label></td>
				<td><input type="password" name="passwordRe"></td>
			</tr>
			<tr>
				<td><label for="email" id="email">이메일</label></td>
				<td><input type="email" name="email"></td>
			</tr>
			<tr>
				<td><label for="hobby" id="hobby">취미</label></td>
				<td>
					<input type="checkbox" name="book">
					<label for="book" id="book">독서</label>
					<input type="checkbox" name="cook">
					<label for="cook" id="cook">요리</label>
					<input type="checkbox" name="run">
					<label for="run" id="run">조깅</label>
					<input type="checkbox" name="swim">
					<label for="swim" id="swim">수영</label>
					<input type="checkbox" name="sleep">
					<label for="sleep" id="sleep">취침</label>
				</td>
			</tr>
			<tr>
				<td><label for="major" id="major">전공</label></td>
				<td>
					<input type="radio" name="kor">
					<label for="kor" id="kor">국어</label>
					<input type="radio" name="eng">
					<label for="eng" id="eng">영어</label>
					<input type="radio" name="math">
					<label for="math" id="math">수학</label>
					<input type="radio" name="design">
					<label for="design" id="design">디자인</label>
				</td>
			</tr>
			<tr>
				<td><label for="tel" id="tel">전화번호</label></td>
				<td>
					<select>
						<option value="SKT">SKT</option>
						<option value="KT">KT</option>
						<option value="LG">LG</option>
					</select>
					<input type="tel" name="tel">
				</td>
			</tr>
			<tr>
				<td colspan="2">
					<input type="submit" value="전송">
					<input type="reset" value="초기화">
				</td>
			</tr>
		</table>
	</form>
</body>
</html>
