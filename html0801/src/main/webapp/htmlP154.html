<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>P154 예제</title>
<style>
	fieldset {
		width: 400px
	}
	label {
		display: inline-block;
		width: 80px;
		text-align: left;
	}
	
	input {
		width: 280px;
	}
</style>
</head>
<body>
	<h2>배송 정보 화면</h2>
	<form name="order" id="orser" class="order" method="post" action="#">
		<fieldset>
			<legend>배송 정보</legend>
			<label for="prod" id="prod">주문상품</label>
			<input type="text" name="prod" value="상품용 3Kg" readonly><br>
			<label for="name" id="name">이름</label>
			<input type="text" name="name" required><br>
			<label for="address" id="address">배송주소</label>
			<input type="text" name="address" required><br>
			<label for="email" id="email">이메일</label>
			<input type="email" name="email"><br>
			<label for="tel" id="tel">연락처</label>
			<input type="tel" name="tel" required value="하이픈 빼고 입력해 주세요.(01012345678)"><br>
			<label for="date" id="date">배송 지정</label>
			<input style="width: 120px " type="date" name="date" required><small>(주문일로부터 최소 3일 이후)</small><br>
			<label for="memo" id="memo">메모</label>
			<textarea rows="10" cols="40" name="memo"></textarea><br>
		</fieldset>
		<p style="align-self:  center">
			<input style="width: 80px" type="submit" value="주문하기">
			<input style="width: 80px" type="submit" value="취소하기">
		</p>
	</form>
</body>
</html>
